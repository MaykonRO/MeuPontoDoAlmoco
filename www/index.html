<title>Volta do Almoço</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
/>
<style>
  /* Layout: black screen, one large blue circle at center showing the device clock. A progress ring wraps it once lunch starts; return time and the two actions sit below. Single dark look by design. */
  :root {
    --bg: #04070d;
    --surface: #0a1220;
    --line: #1a2a47;
    --blue: #2b78f0;
    --blue-deep: #1448a8;
    --blue-soft: #7db2ff;
    --fg: #e8f0ff;
    --muted: #8095b8;
    --alert: #7ee8ff;
    --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto,
      sans-serif;
    --font-time: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas,
      monospace;
    color-scheme: dark;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.4;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .app {
    max-width: 480px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  [hidden] {
    display: none !important;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .gear {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }

  .gear:hover {
    color: var(--fg);
    border-color: var(--blue-soft);
  }

  .gear:focus-visible,
  .chip:focus-visible,
  .modal-close:focus-visible,
  .custom input:focus-visible,
  .custom button:focus-visible {
    outline: 3px solid var(--blue-soft);
    outline-offset: 2px;
  }

  .gear svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .top h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--blue-soft);
  }

  .top .rule {
    color: var(--muted);
    font-size: 14px;
  }

  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  /* Circular button with progress ring */
  .dial {
    --size: min(72vw, 40vh, 300px);
    position: relative;
    width: var(--size);
    height: var(--size);
    flex: 0 0 auto;
  }

  .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    pointer-events: none;
  }

  .ring circle {
    fill: none;
    stroke-width: 2.6;
  }

  .ring .track {
    stroke: var(--line);
  }

  .ring .fill {
    stroke: var(--blue-soft);
    stroke-linecap: round;
    stroke-dasharray: 295.31;
    stroke-dashoffset: 295.31;
    transition: stroke-dashoffset 0.6s ease;
  }

  .dial.late .ring .fill {
    stroke: var(--alert);
  }

  .circle {
    position: absolute;
    inset: 7%;
    width: 86%;
    height: 86%;
    border-radius: 50%;
    border: 0;
    cursor: pointer;
    color: var(--fg);
    font-family: var(--font-ui);
    background: radial-gradient(
      circle at 35% 28%,
      #4a92ff 0%,
      var(--blue) 38%,
      var(--blue-deep) 100%
    );
    box-shadow: 0 0 0 1px rgba(125, 178, 255, 0.35),
      0 18px 48px rgba(43, 120, 240, 0.28);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0;
  }

  .circle:active {
    transform: scale(0.97);
  }

  .circle:focus-visible {
    outline: 3px solid var(--blue-soft);
    outline-offset: 4px;
  }

  .circle[aria-disabled="true"] {
    cursor: pointer;
  }

  .circle[aria-disabled="true"]:active {
    transform: none;
  }

  .clock {
    font-family: var(--font-time);
    font-weight: 700;
    font-size: calc(var(--size) * 0.23);
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }

  .clock small {
    font-size: 0.42em;
    font-weight: 500;
    letter-spacing: 0;
    opacity: 0.7;
  }

  .circle-label {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #d4e4ff;
  }

  /* Return info */
  .info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
    min-height: 96px;
  }

  .kicker {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .back {
    font-family: var(--font-time);
    font-weight: 700;
    font-size: 44px;
    line-height: 1.1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }

  .status {
    font-size: 18px;
    font-weight: 500;
    color: var(--blue-soft);
  }

  .info.late .back,
  .info.late .status {
    color: var(--alert);
  }

  .hint {
    font-size: 17px;
    color: var(--muted);
    max-width: 22ch;
  }

  /* Actions */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row > * {
    flex: 1;
    min-width: 0;
  }

  button.act {
    font: inherit;
    cursor: pointer;
    border-radius: 12px;
    min-height: 54px;
    padding: 0 18px;
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--line);
    font-size: 16px;
    font-weight: 600;
  }

  button.act:focus-visible,
  input:focus-visible {
    outline: 3px solid var(--blue-soft);
    outline-offset: 2px;
  }

  button.act.armed {
    background: var(--blue-deep);
    border-color: var(--blue-soft);
  }

  .editor {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .editor label {
    font-size: 15px;
    color: var(--muted);
  }

  .editor input {
    flex: 1;
    min-width: 0;
    font-family: var(--font-time);
    font-size: 20px;
    min-height: 54px;
    padding: 0 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
  }

  .editor button {
    flex: 0 0 auto;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    min-height: 54px;
    padding: 0 18px;
    border-radius: 12px;
    border: 0;
    background: var(--blue);
    color: #fff;
  }

  .editor button:focus-visible {
    outline: 3px solid var(--blue-soft);
    outline-offset: 2px;
  }

  /* Modal de configuração do tempo de almoço */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(4, 7, 13, 0.76);
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }

  .modal-panel {
    width: 100%;
    max-width: 480px;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 18px 18px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .modal-head h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  .modal-close {
    font: inherit;
    font-weight: 600;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
  }

  .modal-label {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .presets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 10px;
  }

  .chip {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    min-height: 54px;
    padding: 0 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }

  .chip[aria-pressed="true"] {
    background: var(--blue-deep);
    border-color: var(--blue-soft);
  }

  .chip small {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .custom {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .custom label {
    font-size: 15px;
    color: var(--muted);
  }

  .custom input {
    flex: 1;
    min-width: 0;
    font-family: var(--font-time);
    font-size: 20px;
    min-height: 54px;
    padding: 0 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
  }

  .custom button {
    flex: 0 0 auto;
    font: inherit;
    font-weight: 600;
    min-height: 54px;
    padding: 0 18px;
    border-radius: 12px;
    border: 0;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
  }

  .modal-error {
    min-height: 1.4em;
    margin: -8px 0 0;
    font-size: 14px;
    color: var(--alert);
  }

  @media (prefers-reduced-motion: reduce) {
    .ring .fill {
      transition: none;
    }

    .circle:active {
      transform: none;
    }
  }
</style>

<main class="app">
  <div class="top">
    <h1>Volta do Almoço</h1>
    <div class="top-right">
      <span class="rule" id="rule">intervalo de 1 hora</span>
      <button
        type="button"
        class="gear"
        id="gearBtn"
        aria-label="Configurar tempo de almoço"
        aria-haspopup="dialog"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          ></path>
        </svg>
      </button>
    </div>
  </div>

  <section class="stage">
    <div class="dial" id="dial">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="47"></circle>
        <circle class="fill" id="ringFill" cx="50" cy="50" r="47"></circle>
      </svg>
      <button
        type="button"
        class="circle"
        id="circle"
        aria-label="Registrar saída para o almoço"
      >
        <span class="clock" id="clock">--:--</span>
        <span class="circle-label" id="circleLabel">Toque ao sair</span>
      </button>
    </div>

    <div class="info" id="info" aria-live="polite">
      <div class="hint" id="hint">
        Toque no círculo quando sair para o almoço.
      </div>
      <div class="kicker" id="kicker" hidden>Volte às</div>
      <div class="back" id="back" hidden>--:--</div>
      <div class="status" id="status" hidden></div>
    </div>
  </section>

  <div class="actions">
    <div class="editor" id="editor" hidden>
      <label for="timeInput">Saí às</label>
      <input type="time" id="timeInput" />
      <button type="button" id="saveTime">Salvar</button>
    </div>
    <div class="row" id="secondary" hidden>
      <button type="button" class="act" id="fixBtn">Corrigir horário</button>
      <button type="button" class="act" id="clearBtn">Limpar</button>
    </div>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div
    class="modal-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >
    <div class="modal-head">
      <h2 id="modalTitle">Tempo de almoço</h2>
      <button type="button" class="modal-close" id="modalClose">Fechar</button>
    </div>
    <div class="modal-label">Escolha o tempo</div>
    <div class="presets" id="presets"></div>
    <form class="custom" id="customForm" novalidate>
      <label for="customMin">Outro (min)</label>
      <input
        type="number"
        id="customMin"
        inputmode="numeric"
        min="5"
        max="480"
        step="1"
      />
      <button type="submit">Aplicar</button>
    </form>
    <p class="modal-error" id="modalError" aria-live="polite"></p>
  </div>
</div>

<script>
  (function () {
    var KEY = "volta-almoco-saida";
    var DUR_KEY = "volta-almoco-duracao";
    var DEFAULT_MIN = 60;
    var MIN_MIN = 5;
    var MAX_MIN = 480;
    var PRESETS = [30, 45, 60, 90, 120];
    var DAY_LIMIT = 14 * 60 * 60 * 1000;
    var lunchMin = DEFAULT_MIN;
    function lunchMs() {
      return lunchMin * 60000;
    }
    var CIRC = 295.31;
    var exitAt = null;
    var clearArmed = false,
      clearTimer = null;

    function $(id) {
      return document.getElementById(id);
    }
    function pad(n) {
      return ("0" + n).slice(-2);
    }
    function hhmm(ms) {
      var d = new Date(ms);
      return pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
    /* Notificação fixa em 3 níveis. O nível é escolhido uma vez e guardado; só desce se der erro.
           live   = Live Updates (Android 16 ou superior), plugin nativo LiveUpdate
           public = fixa e visível na tela de bloqueio (Android 13 ou superior)
           basic  = fixa na barra de notificações (padrão)
           No navegador nada disso roda. */
    var NOTIF_ID = 1;
    var LEVEL_KEY = "volta-almoco-nivel";
    var CHANNEL_KEY = "volta-almoco-canal";
    var ORDER = ["live", "public", "basic"];
    var level = null;
    var notifChain = Promise.resolve();

    function nativePlugins() {
      var c = window.Capacitor;
      return c &&
        c.isNativePlatform &&
        c.isNativePlatform() &&
        c.Plugins &&
        c.Plugins.LocalNotifications
        ? c.Plugins
        : null;
    }
    function readFlag(k) {
      try {
        return localStorage.getItem(k);
      } catch (e) {
        return null;
      }
    }
    function writeFlag(k, v) {
      try {
        localStorage.setItem(k, v);
      } catch (e) {}
    }
    function setLevel(l) {
      level = l;
      writeFlag(LEVEL_KEY, l);
    }

    function detectLevel(P) {
      if (!P.Device) return Promise.resolve("basic");
      return P.Device.getInfo()
        .then(function (i) {
          var sdk = i.androidSDKVersion || 0;
          if (!sdk) {
            var v = parseInt(i.osVersion, 10) || 0;
            sdk = v >= 16 ? 36 : v >= 13 ? 33 : 0;
          }
          if (sdk >= 36 && P.LiveUpdate) return "live";
          return sdk >= 33 ? "public" : "basic";
        })
        .catch(function () {
          return "basic";
        });
    }
    function currentLevel(P) {
      if (level) return Promise.resolve(level);
      var saved = readFlag(LEVEL_KEY);
      if (ORDER.indexOf(saved) >= 0) {
        level = saved;
        return Promise.resolve(level);
      }
      return detectLevel(P).then(function (l) {
        setLevel(l);
        return l;
      });
    }
    function ensureChannel(ln) {
      if (readFlag(CHANNEL_KEY)) return Promise.resolve();
      return ln
        .createChannel({
          id: "volta-publico",
          name: "Volta do almoço",
          description: "Horário de voltar do almoço",
          importance: 3,
          visibility: 1,
          vibration: false,
        })
        .then(function () {
          writeFlag(CHANNEL_KEY, "1");
        });
    }
    function show(P, lvl, n) {
      var ln = P.LocalNotifications;
      if (lvl === "live")
        return P.LiveUpdate.show({
          id: NOTIF_ID,
          title: n.title,
          body: n.body,
          shortText: n.short,
        });
      var item = {
        id: NOTIF_ID,
        title: n.title,
        body: n.body,
        ongoing: true,
        autoCancel: false,
      };
      if (lvl === "public") {
        return ensureChannel(ln).then(function () {
          item.channelId = "volta-publico";
          return ln.schedule({ notifications: [item] });
        });
      }
      return ln.schedule({ notifications: [item] });
    }
    function attempt(P, lvl, n) {
      return Promise.resolve()
        .then(function () {
          return show(P, lvl, n);
        })
        .then(
          function () {
            if (level !== lvl) setLevel(lvl);
          },
          function () {
            var next = ORDER[ORDER.indexOf(lvl) + 1];
            if (!next) return;
            setLevel(next);
            return attempt(P, next, n);
          }
        );
    }
    function runSync(P) {
      return currentLevel(P).then(function (lvl) {
        if (exitAt == null) {
          var gone =
            lvl === "live"
              ? P.LiveUpdate.cancel({ id: NOTIF_ID })
              : P.LocalNotifications.cancel({
                  notifications: [{ id: NOTIF_ID }],
                });
          return gone.catch(function () {});
        }
        return P.LocalNotifications.requestPermissions().then(function (r) {
          if (r.display !== "granted") return;
          var back = hhmm(exitAt + lunchMs());
          return attempt(P, lvl, {
            title: "Volte às " + back,
            body: "Saída registrada às " + hhmm(exitAt),
            short: back,
          });
        });
      });
    }
    function syncNotification() {
      var P = nativePlugins();
      if (!P) return;
      notifChain = notifChain
        .then(function () {
          return runSync(P);
        })
        .catch(function () {});
    }
    function save(ms) {
      exitAt = ms;
      try {
        if (ms == null) localStorage.removeItem(KEY);
        else localStorage.setItem(KEY, String(ms));
      } catch (e) {}
      syncNotification();
    }
    function load() {
      try {
        var v = localStorage.getItem(KEY);
        if (v) {
          var n = Number(v);
          if (
            !isNaN(n) &&
            Date.now() - n < DAY_LIMIT &&
            n <= Date.now() + 60000
          )
            exitAt = n;
          else localStorage.removeItem(KEY);
        }
      } catch (e) {}
    }
    function mins(ms) {
      return Math.max(0, Math.ceil(ms / 60000));
    }
    function human(m) {
      if (m < 60) return m + " min";
      var h = Math.floor(m / 60),
        r = m % 60;
      return r ? h + " h " + r + " min" : h + " h";
    }

    function render() {
      var now = new Date();
      $("clock").innerHTML =
        pad(now.getHours()) +
        ":" +
        pad(now.getMinutes()) +
        "<small>:" +
        pad(now.getSeconds()) +
        "</small>";

      var circle = $("circle"),
        dial = $("dial"),
        info = $("info");
      if (exitAt == null) {
        circle.removeAttribute("aria-disabled");
        circle.setAttribute("aria-label", "Registrar saída para o almoço");
        $("circleLabel").textContent = "Toque ao sair";
        $("hint").hidden = false;
        $("kicker").hidden = true;
        $("back").hidden = true;
        $("status").hidden = true;
        $("ringFill").style.strokeDashoffset = CIRC;
        dial.className = "dial";
        info.className = "info";
        $("secondary").hidden = true;
        return;
      }

      var t = now.getTime(),
        back = exitAt + lunchMs(),
        diff = back - t;
      circle.setAttribute("aria-disabled", "true");
      circle.setAttribute("aria-label", "Saída registrada às " + hhmm(exitAt));
      $("circleLabel").textContent = "Saída " + hhmm(exitAt);
      $("hint").hidden = true;
      $("kicker").hidden = false;
      $("back").hidden = false;
      $("status").hidden = false;
      $("back").textContent = hhmm(back);
      var pct = Math.min(1, Math.max(0, (t - exitAt) / lunchMs()));
      $("ringFill").style.strokeDashoffset = CIRC * (1 - pct);

      var late = diff <= 0;
      dial.className = "dial" + (late ? " late" : "");
      info.className = "info" + (late ? " late" : "");
      if (diff > 0) $("status").textContent = "Faltam " + human(mins(diff));
      else if (diff > -60000) $("status").textContent = "Hora de voltar";
      else
        $("status").textContent =
          "Passou " + human(mins(-diff)) + " do horário";
      $("secondary").hidden = false;
    }

    /* Tempo de almoço: padrão 1 h, guardado no aparelho */
    function fmtDur(m) {
      if (m === 60) return "1 hora";
      if (m === 120) return "2 horas";
      if (m < 60) return m + " min";
      var h = Math.floor(m / 60),
        r = m % 60;
      return r ? h + " h " + pad(r) + " min" : h + " h";
    }
    function loadDuration() {
      try {
        var n = parseInt(localStorage.getItem(DUR_KEY), 10);
        if (n >= MIN_MIN && n <= MAX_MIN) lunchMin = n;
      } catch (e) {}
    }
    function buildPresets() {
      var box = $("presets");
      PRESETS.forEach(function (m) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.dataset.min = String(m);
        b.textContent = fmtDur(m);
        if (m === DEFAULT_MIN) {
          var tag = document.createElement("small");
          tag.textContent = "padrão";
          b.appendChild(tag);
        }
        b.addEventListener("click", function () {
          setDuration(m);
        });
        box.appendChild(b);
      });
    }
    function updateDurationUI() {
      $("rule").textContent = "intervalo de " + fmtDur(lunchMin);
      var chips = $("presets").children;
      for (var i = 0; i < chips.length; i++) {
        chips[i].setAttribute(
          "aria-pressed",
          String(Number(chips[i].dataset.min) === lunchMin)
        );
      }
      $("customMin").value = PRESETS.indexOf(lunchMin) >= 0 ? "" : lunchMin;
    }
    function setDuration(m) {
      if (!(m >= MIN_MIN && m <= MAX_MIN)) return false;
      lunchMin = m;
      try {
        localStorage.setItem(DUR_KEY, String(m));
      } catch (e) {}
      $("modalError").textContent = "";
      updateDurationUI();
      if (exitAt != null) syncNotification();
      render();
      return true;
    }
    var lastFocus = null;
    function openModal() {
      lastFocus = document.activeElement;
      $("modal").hidden = false;
      var sel = $("presets").querySelector('[aria-pressed="true"]');
      (sel || $("modalClose")).focus();
    }
    function closeModal() {
      $("modal").hidden = true;
      $("modalError").textContent = "";
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    function disarm() {
      clearArmed = false;
      var b = $("clearBtn");
      b.textContent = "Limpar";
      b.classList.remove("armed");
      if (clearTimer) {
        clearTimeout(clearTimer);
        clearTimer = null;
      }
    }

    $("circle").addEventListener("click", function () {
      if (exitAt != null) {
        save(null);
        return;
      }
      save(Date.now());
      render();
    });
    $("fixBtn").addEventListener("click", function () {
      var ed = $("editor");
      ed.hidden = !ed.hidden;
      if (!ed.hidden && exitAt != null) {
        var d = new Date(exitAt);
        $("timeInput").value = pad(d.getHours()) + ":" + pad(d.getMinutes());
      }
    });
    $("saveTime").addEventListener("click", function () {
      var v = $("timeInput").value;
      if (!v) return;
      var p = v.split(":"),
        d = new Date();
      d.setHours(Number(p[0]), Number(p[1]), 0, 0);
      if (d.getTime() > Date.now() + 60000) d.setDate(d.getDate() - 1);
      save(d.getTime());
      $("editor").hidden = true;
      render();
    });
    $("clearBtn").addEventListener("click", function () {
      var b = $("clearBtn");
      if (!clearArmed) {
        clearArmed = true;
        b.textContent = "Confirmar limpar";
        b.classList.add("armed");
        clearTimer = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      save(null);
      $("editor").hidden = true;
      render();
    });

    $("gearBtn").addEventListener("click", openModal);
    $("modalClose").addEventListener("click", closeModal);
    $("modal").addEventListener("click", function (e) {
      if (e.target === $("modal")) closeModal();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !$("modal").hidden) closeModal();
    });
    $("customForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var n = parseInt($("customMin").value, 10);
      if (!setDuration(n)) {
        $("modalError").textContent =
          "Use de " + MIN_MIN + " a " + MAX_MIN + " minutos.";
      }
    });

    loadDuration();
    buildPresets();
    updateDurationUI();
    load();
    if (exitAt != null) syncNotification();
    render();
    setInterval(render, 1000);
    document.addEventListener("visibilitychange", render);
  })();
</script>
