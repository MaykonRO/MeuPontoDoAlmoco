name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          bash scripts/prepare-android.sh
        env:
          APP_VERSION_CODE: ${{ github.run_number }}

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: volta-do-almoco-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Só na main: publica o APK numa release. O link
      # /releases/latest/download/volta-do-almoco.apk sempre aponta para a mais recente.
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk volta-do-almoco.apk
          gh release create "v1.0.${{ github.run_number }}" volta-do-almoco.apk \
            --target "${{ github.sha }}" \
            --title "Volta do Almoço 1.0.${{ github.run_number }}" \
            --notes "APK de teste (debug). Commit ${{ github.sha }}." \
            --latest
